version: "3.9"

networks:
  backend:
    ipam:
      driver: default
      config:
        - subnet: 192.10.0.0/16

services:
  redis:
    image: redis:alpine
    container_name: redis_db
    ports:
      - 6379:6379
    networks:
      backend:
        ipv4_address: 192.10.1.5

  localstack:
    image: localstack/localstack:3.8.0
    container_name: localstack
    ports:
      - 4566:4566
      - 4510-4559:4510-4559
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ACTIVATE_PRO=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack_data:/var/lib/localstack"
    networks:
      backend:
        ipv4_address: 192.10.1.6

